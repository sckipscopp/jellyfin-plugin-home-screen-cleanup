name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify SDK band
        run: dotnet --version | grep -E '^10\.0\.4'

      - name: Restore (locked)
        run: dotnet restore Jellyfin.Plugin.HomeScreenCleanup.slnx --locked-mode

      - name: Build
        run: dotnet build Jellyfin.Plugin.HomeScreenCleanup.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Jellyfin.Plugin.HomeScreenCleanup.slnx -c Release --no-build

      - name: Publish
        run: dotnet publish src/Jellyfin.Plugin.HomeScreenCleanup/Jellyfin.Plugin.HomeScreenCleanup.csproj -c Release --no-build -o publish

      - name: Upload plugin DLL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Jellyfin.Plugin.HomeScreenCleanup
          path: publish/Jellyfin.Plugin.HomeScreenCleanup.dll
          if-no-files-found: error
          retention-days: 14
