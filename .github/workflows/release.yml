name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, branch and version
        id: validate
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$tag' is not vX.Y.Z"; exit 1; }

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag commit $GITHUB_SHA is not on main"; exit 1; }

          version="${tag#v}.0"
          yaml_version="$(yq -r '.version' build.yaml)"
          [[ "$yaml_version" == "$version" ]] \
            || { echo "::error::build.yaml version '$yaml_version' != '$version'"; exit 1; }

          header="$(awk -v v="$version" '/^## / && $2 == v { print; exit }' CHANGELOG.md)"
          [[ -n "$header" ]] || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
          if grep -qi 'unreleased' <<<"$header"; then
            echo "::error::CHANGELOG.md section for $version is still marked unreleased"; exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET SDK (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify SDK band
        run: dotnet --version | grep -E '^10\.0\.4'

      - name: Restore (locked)
        run: dotnet restore Jellyfin.Plugin.HomeScreenCleanup.slnx --locked-mode

      - name: Build
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: dotnet build Jellyfin.Plugin.HomeScreenCleanup.slnx -c Release --no-restore -warnaserror "-p:Version=$VERSION"

      - name: Test
        run: dotnet test Jellyfin.Plugin.HomeScreenCleanup.slnx -c Release --no-build

      - name: Publish
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: dotnet publish src/Jellyfin.Plugin.HomeScreenCleanup/Jellyfin.Plugin.HomeScreenCleanup.csproj -c Release --no-build -o publish "-p:Version=$VERSION"

      - name: Package
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: bash scripts/package.sh "$VERSION"

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.md5 dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/notes.md

      # The only checkout that keeps credentials: it pushes the manifest commit to main.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: repo

      - name: Update manifest and push
        working-directory: repo
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          zip="home-screen-cleanup_${VERSION}.zip"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${zip}"

          bash scripts/update-manifest.sh ../dist/meta.json "../dist/${zip}.md5" "$url" manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: add ${VERSION} [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt ${attempt} rejected; rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "::error::could not push the manifest commit after 3 attempts"
          exit 1
