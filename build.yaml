name: "Home Screen Cleanup"
guid: "48774b8b-b1b2-49b0-b3f4-4ebaf867a696"
version: "1.0.4.0"
targetAbi: "12.2.0.0"
framework: "net10.0"
owner: "sckipscopp"
overview: "Remove items from Continue Watching and series from Next Up on the home screen."
description: >
  Adds "Remove from Continue Watching" and "Remove from Next Up" to the "..." menu of
  home-screen cards in the web client. Continue Watching marks the item (every version) played,
  which clears its resume position and keeps it out of Next Up. Next Up hides the series
  for that user on every client until an episode of it is played again.
category: "General"
artifacts:
  - "Jellyfin.Plugin.HomeScreenCleanup.dll"
changelog: >
  Remove from Continue Watching now marks the item played (a reset-only episode came back in
  Next Up). Remove from Next Up: per-user hide, auto-unhide on playback.
